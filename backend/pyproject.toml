[project]
name = "codeflow-backend"
version = "0.1.0"
description = "CodeFlow Explorer backend: static code map + Claude-powered flow graphs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiosqlite>=0.22",
    "anthropic>=1.6,<2",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.24",
    "tree-sitter-rust>=0.24",
    "pathspec>=1.1",
    "cryptography>=45",
    "structlog>=25",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=1.19",
    "types-python-dateutil",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PTH", "RET", "ARG", "PL"]
ignore = [
    "PLR0913",  # many arguments is fine for explicit constructors
    "PLR2004",  # magic numbers in thresholds are documented inline
    "S101",     # asserts in tests
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript", "tree_sitter_java",
          "tree_sitter_go", "tree_sitter_c", "tree_sitter_cpp", "tree_sitter_c_sharp", "tree_sitter_ruby",
          "tree_sitter_php", "tree_sitter_rust", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
